<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SDET Quest — learn, practice and prove SDET 3 and QA Lead interview skills." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0e15" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SDET Quest</title>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('sdet-quest:v1') || 'null');
        var t = s && s.state && s.state.settings && s.state.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
